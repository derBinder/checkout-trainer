name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Der Rück-PR main → develop nach einem Release ändert keinen Inhalt (CLAUDE.md, Ablauf Schritt 12).
    if: ${{ !(github.head_ref == 'main' && github.base_ref == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Vitest nimmt ohne Angabe CPUs - 1 Worker, auf dem 2-vCPU-Runner also nur einen.
      - run: npm run test:coverage -- --maxWorkers=100%
      - run: npm run typecheck
      - run: npm run lint
