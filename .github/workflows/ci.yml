name: CI

on:
  pull_request:
    branches: [develop, main]
    # Reine Doku-Änderungen brauchen keinen Lauf (CLAUDE.md, Abschnitt CI).
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Release- und Hotfix-Branches zurück nach develop: derselbe Stand war gerade in main grün.
    if: ${{ !(github.base_ref == 'develop' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Vitest nimmt ohne Angabe CPUs - 1 Worker, auf dem 2-vCPU-Runner also nur einen.
      - run: npm run test:coverage -- --maxWorkers=100%
      - run: npm run typecheck
      - run: npm run lint
